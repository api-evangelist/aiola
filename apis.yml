aid: aiola
name: aiOla
description: 'aiOla is a deep-tech voice, speech and conversational AI lab that sells enterprise Speech
  AI as an API: the Jargonic family of multilingual automatic speech recognition models (Jargonic-v2,
  Jargonic-v2-Flash, Jargonic-v1) with zero-shot jargon and keyword spotting, a low-latency text-to-speech
  model with jargon-pronunciation conditioning, and a speech-understanding layer covering summarization,
  sentiment, entity, topic and key-phrase detection, auto chapters, content moderation and PII redaction.
  The developer surface is delivered through first-party Python, JavaScript/TypeScript, C# and Swift SDKs
  against a REST + Socket.IO API, with a two-tier API-key-to-JWT authentication model. The company also
  packages the same technology as field voice agents that capture data into Salesforce for enterprise
  field teams.'
