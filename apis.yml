- aid: aiola:aiola-auth
  name: aiOla Authentication API
  image: https://aiola.ai/wp-content/uploads/2026/03/favicon-300x300.png
  description: Two-tier authentication service. An API key is exchanged for a short-lived bearer token
    (POST /voip-auth/apiKey2Token), which is then exchanged for a session JWT access token scoped to a
    workflow (POST /voip-auth/session); the session is released with DELETE /voip-auth/session. Access
    tokens are documented as lasting roughly 30 minutes.
  humanURL: https://docs.aiola.ai/developer-guides/authentication
  baseURL: https://auth.aiola.ai
  tags:
  - Authentication
  - Tokens
  properties:
