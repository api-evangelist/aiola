apis:
- aid: aiola:aiola-speech-to-text
  name: aiOla Speech to Text API
  image: https://aiola.ai/wp-content/uploads/2026/03/favicon-300x300.png
  description: Jargonic automatic speech recognition. Batch file transcription over HTTP (POST /api/speech-to-text/file,
    50 MB maximum file size) and real-time streaming transcription over a Socket.IO connection at /api/voice-streaming/socket.io
    on the /events namespace, with zero-shot keyword spotting against a caller-supplied jargon dictionary.
    No OpenAPI description is published by the provider; the operation surface recorded here is read from
    aiOla's own open-source SDKs.
  humanURL: https://docs.aiola.ai/developer-guides/speech-to-text/quickstart
  baseURL: https://apis.aiola.ai
