method: derived
source: >-
  docs.aiola.ai developer guides, the first-party SDK source at
  github.com/aiola-lab/aiola-python-sdk, and the public Trust Center page data behind
  trust.aiola.ai
note: >-
  aiOla publishes no machine-readable contract, so each entry below is asserted from the
  documented wire behaviour or the SDK that implements it. Absence is recorded as
  conforms:false with the evidence that establishes the absence, never left blank.
conformance:
- id: oauth2
  conforms: false
  evidence: >-
    No authorization server, no /authorize or /token endpoint, no grant type, no scopes.
    Credentials are exchanged by a proprietary POST /voip-auth/apiKey2Token +
    POST /voip-auth/session pair described at
    https://docs.aiola.ai/developer-guides/authentication.
- id: oidc
  conforms: false
  evidence: /.well-known/openid-configuration returns 404 on aiola.ai and docs.aiola.ai and
    no response at all on auth.aiola.ai.
- id: rfc6750
  name: OAuth 2.0 Bearer Token Usage
  conforms: partial
  evidence: >-
    Credentials are presented as `Authorization: Bearer <token>` on every call, which is
    the RFC 6750 header form, but the tokens are not OAuth 2.0 access tokens and no
    WWW-Authenticate challenge is documented on 401.
- id: rfc7519
  name: JSON Web Token
  conforms: true
  evidence: >-
    The session credential is a JWT — aiOla's own SDK base64url-decodes the payload and
    reads the `exp` claim to decide when to re-mint
    (aiola/clients/auth/client.py, _parse_jwt_payload).
- id: rfc9457
  name: Problem Details for HTTP APIs
  conforms: false
  evidence: >-
    Errors are a proprietary { "error": { "code", "message" } } envelope with no
    application/problem+json media type. See errors/aiola-error-codes.yml.
- id: rfc9116
  name: security.txt
  conforms: false
  evidence: 404 on every host probed — see security/aiola-vulnerability-disclosure.yml.
- id: rfc8594
  name: Sunset HTTP Header
  conforms: false
  evidence: No deprecation policy and no Sunset/Deprecation header behaviour is documented.
- id: rfc9727
  name: api-catalog well-known URI
  conforms: partial
  evidence: >-
    https://docs.aiola.ai/.well-known/api-catalog returns 200 with the correct
    application/linkset+json media type, but the linkset array is empty and the document
    is emitted by the Fern docs platform rather than authored by aiOla. Correct form, no
    content.
- id: idempotency
  conforms: false
  evidence: >-
    No Idempotency-Key header or replay window anywhere in the docs or either SDK. See
    conventions/aiola-conventions.yml (idempotency.coverage = none).
- id: pagination
